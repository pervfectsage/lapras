<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turbo C/C++ IDE</title><link rel="icon" type="image/png" href="assets/lapras.png"><meta name="color-scheme" content="light dark"><script>try{document.documentElement.dataset.theme=localStorage.getItem('turbo-classroom-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch{document.documentElement.dataset.theme='light'}</script><link rel="stylesheet" href="lapras-ui-v20.css"></head><body>
<header><a class="brand" href="./"><span class="brand-sprite"><img src="assets/lapras.png" alt="Cute Lapras pixel sprite" width="80" height="80"></span><div class="brand-text">Lapras<span class="brand-description">A Turbo C/C++ IDE</span></div></a><button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false"><span id="theme-icon" aria-hidden="true">☾</span><span id="theme-label">Dark mode</span></button></header>
<main><div class="workspace"><section class="machine"><div class="toolbar"><button data-keys="17,120" disabled>▶ Run <kbd>Ctrl F9</kbd></button><button data-keys="18,120" disabled>Compile <kbd>Alt F9</kbd></button><button data-keys="18,116" disabled>Output <kbd>Alt F5</kbd></button><button data-keys="113" disabled>Save <kbd>F2</kbd></button><button data-keys="27" disabled>Esc</button><button id="full">⛶ Fullscreen</button></div><span id="status" class="sr-only" role="status">Ready to start</span><div id="screen"><canvas id="dos" tabindex="0" aria-label="Turbo C++ DOS workspace"></canvas><div id="launch"><button id="start" class="primary">Launch Turbo C++ →</button></div></div></section>
<div id="panel-divider" role="separator" aria-label="Resize code panel" aria-orientation="vertical" aria-valuemin="260" aria-valuemax="680" aria-valuenow="320" tabindex="0" title="Drag to resize · arrow keys to adjust · double-click to reset"><span></span></div><aside class="code-panel" aria-label="Code editor panel">
<div class="panel-head"><span>YOUR CODE</span><span class="panel-badge">C / C++</span></div>
<div class="aside-inner">
<div class="file-bar"><div class="file-name"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H5v18h14V8zM14 3v5h5M8 12h8m-8 4h5"/></svg><label class="sr-only" for="filename">DOS filename</label><input id="filename" value="HELLO.CPP" maxlength="12" spellcheck="false" title="DOS filename (up to 8 characters plus extension)"></div><div class="file-tools" role="group" aria-label="File actions"><button id="import" class="icon-button" title="Import code file" aria-label="Import code file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m-4 4 4-4 4 4M4 15v5h16v-5"/></svg></button><button id="copy" class="icon-button" type="button" title="Copy code" aria-label="Copy code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button><button id="download" class="icon-button" title="Download code" aria-label="Download code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v13m-4-4 4 4 4-4M4 16v5h16v-5"/></svg></button></div></div>
<div class="editor-shell"><label class="sr-only" for="code">Program source code</label><textarea id="code" spellcheck="false" aria-label="Program source code"></textarea><div class="editor-status"><span id="copy-status" role="status" aria-live="polite">Ready to edit</span><span id="line-count">1 line</span></div></div>
<input id="file" type="file" accept=".c,.cpp,.h,.txt" hidden>
<div class="transfer-actions"><button id="load" class="primary" title="Open panel code in Turbo C++" disabled>Open in IDE <span aria-hidden="true">↗</span></button><button id="retrieve" title="Read the file saved with F2 in Turbo C++" disabled><span aria-hidden="true">↙</span> Read saved</button></div>
<div class="starter-row"><label for="examples">Starter</label><select id="examples"><option value="hello">Hello, classroom</option><option value="input">Add two numbers</option><option value="graphics">Draw a circle · BGI</option></select></div>
<details class="editor-help"><summary>How to move code between editors</summary><p><b>Panel → IDE:</b> choose Open in IDE.<br><b>IDE → panel:</b> press F2 in Turbo C++, then Read saved. Use the same filename above. Copy and download use the code in this panel.</p></details>
</div></aside></div>
<p id="message" class="sr-only" role="status"></p></main><footer><a href="notices.html">Software notices</a></footer><script src="js-dos.js"></script><script src="wdosbox.js"></script><script src="ide-settings.js?v=10"></script><script src="lapras-app-v21.js"></script></body></html>
